title: Jablotron
views:
  - title: Jablotron
    path: jablotron
    icon: mdi:shield
    cards:

      # Sections — native alarm panels with arm/disarm buttons
      - type: custom:auto-entities
        card:
          type: grid
          columns: 1
          square: false
        card_param: cards
        filter:
          include:
            - domain: alarm_control_panel
              entity_id: alarm_control_panel.jablotron_section_*
              options:
                type: tile
                features:
                  - type: alarm-modes
                    modes:
                      - armed_away
                      - armed_home
                      - disarmed
        sort:
          method: name

      # PG outputs — toggle switches
      - type: custom:auto-entities
        card:
          type: grid
          columns: 2
          square: false
        card_param: cards
        filter:
          include:
            - domain: switch
              entity_id: switch.jablotron_pg_*
              options:
                type: tile
        sort:
          method: name

      # Raw section states (diagnostic)
      - type: custom:auto-entities
        card:
          type: entities
          title: Stav sekcí
        filter:
          include:
            - domain: sensor
              entity_id: sensor.jablotron_zone_*
        sort:
          method: name
